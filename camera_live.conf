# Camera and local display
iq_dir=/etc/iqfiles
frame_source=vpss
video_codec=h265
audio_codec=aac
lvgl=true

# Leave empty to disable RTMP publishing.
rtmp_url=rtmp://192.168.0.104/live/stream

# H.265 video RTSP service
rtsp_enabled=true
rtsp_port=554
rtsp_path=/live/0

# ONVIF Profile S discovery and device/media services
onvif_enabled=true
onvif_port=8080
onvif_device_name=Luckfox Camera
onvif_interface=eth0
onvif_username=admin
onvif_password=admin
